name: validate

# PR 门禁（计划 §6.7 门禁硬性化）：pytest + validate_translation + mkdocs build 冒烟。
# 全部步骤退出码自然生效，禁止 || true 软门禁。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pytest（脚本与状态机测试）
        run: pytest tests/ -q

      - name: validate_translation（全量，退出码生效）
        run: python scripts/validate_translation.py

      - name: mkdocs build 冒烟（非 strict：warning 对照批次基线，计划 §6.5）
        run: mkdocs build --clean

      - name: linkcheck（仅告警不阻断，输出供审阅）
        run: python scripts/linkcheck.py
