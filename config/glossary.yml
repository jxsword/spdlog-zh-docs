# spdlog 中文翻译术语表（glossary.yml）
# 结构：terms（en/zh/status/context/aliases）+ banned（禁用译名黑名单）
# 规则（计划 §6.8）：
#   - 术语表为唯一来源；变更走 PR，合并后术语扫描全量生效
#   - API 名/函数/类/宏/头文件/代码不译；术语首现括注原文
#   - banned 由 validate_translation.py 检查 6b 机器扫描（0 违规硬门禁）
#   - status: approved / provisional（provisional 条目 M2 批次复核后转正）

